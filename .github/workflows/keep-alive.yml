# A free Supabase project is paused after a week without requests, and a
# paused project answers nothing until someone restores it by hand. Two reads
# a week keep the Fleet Log answering between visitors.
name: keep-alive

on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row of the Fleet Log
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$URL" && test -n "$KEY"
          curl -fsS "$URL/rest/v1/fleet_log?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
